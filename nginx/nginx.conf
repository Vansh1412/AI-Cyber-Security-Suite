worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    client_max_body_size 2M;

    # Rate limiting zone for general API endpoints (60 req/min)
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=60r/m;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' ws: wss:;" always;

    server {
        listen 80;
        server_name localhost;

        # Dedicated unbuffered SSE streaming location regex
        # Matches /v1/soc/stream, /v1/alerts/stream, /v1/notifications/stream, /v1/admin/soc/stream
        location ~* ^/v1/(soc|alerts|notifications|admin/soc)/stream$ {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Stream ticketing and stream auxiliary subroutes
        location /v1/streams/ {
            proxy_pass http://api:8000/v1/streams/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API routes with rate limiting
        location /v1/ {
            limit_req zone=api_zone burst=20 nodelay;
            proxy_pass http://api:8000/v1/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
